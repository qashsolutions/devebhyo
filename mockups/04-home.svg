<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>
  <rect x="310" y="12" width="22" height="10" rx="2" stroke="#1A1A1A" stroke-width="1" fill="none"/>
  <rect x="312" y="14" width="14" height="6" rx="1" fill="#1A1A1A"/>

  <!-- Top bar: brand + settings -->
  <text x="24" y="68" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="1">DEVEBHYO</text>
  <!-- Settings gear -->
  <circle cx="354" cy="62" r="4" stroke="#9B9590" stroke-width="1.2" fill="none"/>
  <path d="M354 54v2m0 12v2m-6.9-3.5l1.4-1.4m11-11l1.4-1.4m-16 6.4h2m12 0h2m-3.5 6.9l-1.4-1.4m-11-11l-1.4-1.4" stroke="#9B9590" stroke-width="1" stroke-linecap="round"/>

  <!-- === CENTER: Voice mic === -->
  <!-- Mic circle - primary interaction -->
  <circle cx="195" cy="340" r="40" fill="#C45B28"/>
  <!-- Shadow under mic -->
  <circle cx="195" cy="342" r="42" fill="none" stroke="#00000008" stroke-width="4"/>

  <!-- Mic icon (white) -->
  <rect x="188" y="322" width="14" height="22" rx="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <path d="M180 338c0 7.5 6.7 13 15 13s15-5.5 15-13" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="195" y1="351" x2="195" y2="357" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="189" y1="357" x2="201" y2="357" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Hint text -->
  <text x="195" y="406" font-size="13" fill="#9B9590" text-anchor="middle">Tap to speak in your language</text>

  <!-- === BOTTOM: Near you === -->
  <text x="24" y="540" font-size="11" fill="#9B9590" letter-spacing="1">NEAR YOU</text>

  <!-- Temple 1 (nearest) -->
  <g transform="translate(24, 558)">
    <circle cx="4" cy="12" r="4" fill="#1A3A5C"/>
    <text x="20" y="8" font-size="14" font-weight="500" fill="#1A1A1A">Birla Mandir</text>
    <text x="20" y="22" font-size="11" fill="#9B9590">Hyderabad -- 3.2 km</text>
    <path d="M354 10l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Separator -->
  <line x1="24" y1="592" x2="366" y2="592" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Temple 2 -->
  <g transform="translate(24, 600)">
    <circle cx="4" cy="12" r="4" fill="#1A3A5C"/>
    <text x="20" y="8" font-size="14" font-weight="500" fill="#1A1A1A">Thousand Pillar Temple</text>
    <text x="20" y="22" font-size="11" fill="#9B9590">Warangal -- 142 km</text>
    <path d="M354 10l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Separator -->
  <line x1="24" y1="634" x2="366" y2="634" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Temple 3 -->
  <g transform="translate(24, 642)">
    <circle cx="4" cy="12" r="4" fill="#1A3A5C"/>
    <text x="20" y="8" font-size="14" font-weight="500" fill="#1A1A1A">Yadagirigutta Temple</text>
    <text x="20" y="22" font-size="11" fill="#9B9590">Yadagirigutta -- 62 km</text>
    <path d="M354 10l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Separator -->
  <line x1="24" y1="676" x2="366" y2="676" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Nearest priest (saffron dot) -->
  <g transform="translate(24, 684)">
    <circle cx="4" cy="12" r="4" fill="#C45B28"/>
    <text x="20" y="8" font-size="14" font-weight="500" fill="#1A1A1A">Pandit Raghunath Sharma</text>
    <text x="20" y="22" font-size="11" fill="#9B9590">Hyderabad -- 3.2 km</text>
    <path d="M354 10l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Explore map link -->
  <g transform="translate(145, 740)">
    <!-- Pin icon -->
    <path d="M8 14c0-3.3 2.7-6 6-6s6 2.7 6 6-6 11.5-6 11.5-6-8.2-6-11.5z" stroke="#6B6560" stroke-width="1.2" fill="none" transform="scale(0.6) translate(-4, -10)"/>
    <circle cx="5.5" cy="5" r="1.5" stroke="#6B6560" stroke-width="1" fill="none"/>
    <text x="16" y="9" font-size="12" font-weight="500" fill="#6B6560">Explore map</text>
  </g>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

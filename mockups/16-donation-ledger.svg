<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">Donation Ledger</text>

  <!-- Summary card -->
  <rect x="24" y="96" width="342" height="84" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 118)">
    <!-- This Month -->
    <text x="0" y="0" font-size="10" fill="#9B9590" letter-spacing="0.8">THIS MONTH</text>
    <text x="0" y="24" font-size="28" font-weight="700" fill="#2E7D52">&#8377;45,200</text>
    <text x="0" y="44" font-size="11" fill="#9B9590">32 donations from 28 devotees</text>
  </g>

  <!-- 100% badge -->
  <rect x="24" y="196" width="342" height="32" rx="8" fill="#E8F5EE"/>
  <text x="195" y="217" font-size="11" font-weight="500" fill="#2E7D52" text-anchor="middle">&#10003; 100% of every donation reaches your temple</text>

  <!-- Filter chips -->
  <g transform="translate(24, 248)">
    <rect x="0" y="0" width="82" height="28" rx="14" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="41" y="19" font-size="12" font-weight="500" fill="#6B6560" text-anchor="middle">This Week</text>

    <rect x="92" y="0" width="92" height="28" rx="14" fill="#C45B28"/>
    <text x="138" y="19" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">This Month</text>

    <rect x="194" y="0" width="72" height="28" rx="14" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="230" y="19" font-size="12" font-weight="500" fill="#6B6560" text-anchor="middle">All Time</text>
  </g>

  <!-- Section: Donations list -->
  <text x="28" y="306" font-size="11" fill="#9B9590" letter-spacing="1">FEBRUARY 2026</text>

  <!-- Donation 1 -->
  <rect x="24" y="316" width="342" height="64" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 332)">
    <circle cx="8" cy="8" r="8" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="1"/>
    <text x="8" y="12" font-size="9" font-weight="600" fill="#C45B28" text-anchor="middle">RS</text>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Ramesh Sharma</text>
    <text x="24" y="20" font-size="11" fill="#9B9590">28 Feb, 7:32 AM  ·  General donation</text>
    <text x="290" y="10" font-size="15" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;1,000</text>
  </g>

  <!-- Donation 2 -->
  <rect x="24" y="392" width="342" height="64" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 408)">
    <circle cx="8" cy="8" r="8" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="1"/>
    <text x="8" y="12" font-size="9" font-weight="600" fill="#9B9590" text-anchor="middle">?</text>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Anonymous</text>
    <text x="24" y="20" font-size="11" fill="#9B9590">28 Feb, 6:15 AM  ·  General donation</text>
    <text x="290" y="10" font-size="15" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;500</text>
  </g>

  <!-- Donation 3 -->
  <rect x="24" y="468" width="342" height="64" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 484)">
    <circle cx="8" cy="8" r="8" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="1"/>
    <text x="8" y="12" font-size="9" font-weight="600" fill="#C45B28" text-anchor="middle">PR</text>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Priya Reddy</text>
    <text x="24" y="20" font-size="11" fill="#9B9590">27 Feb, 4:45 PM  ·  Abhishekam seva</text>
    <text x="290" y="10" font-size="15" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;2,100</text>
  </g>

  <!-- Donation 4 -->
  <rect x="24" y="544" width="342" height="64" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 560)">
    <circle cx="8" cy="8" r="8" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="1"/>
    <text x="8" y="12" font-size="9" font-weight="600" fill="#C45B28" text-anchor="middle">VK</text>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Venkat Krishna</text>
    <text x="24" y="20" font-size="11" fill="#9B9590">27 Feb, 10:00 AM  ·  Homam seva</text>
    <text x="290" y="10" font-size="15" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;5,000</text>
  </g>

  <!-- Donation 5 -->
  <rect x="24" y="620" width="342" height="64" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 636)">
    <circle cx="8" cy="8" r="8" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="1"/>
    <text x="8" y="12" font-size="9" font-weight="600" fill="#C45B28" text-anchor="middle">SL</text>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Sita Lakshmi</text>
    <text x="24" y="20" font-size="11" fill="#9B9590">26 Feb, 8:30 AM  ·  Archana seva</text>
    <text x="290" y="10" font-size="15" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;500</text>
  </g>

  <!-- Fade gradient at bottom -->
  <defs>
    <linearGradient id="fadeDonations" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="710" width="390" height="110" fill="url(#fadeDonations)"/>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>
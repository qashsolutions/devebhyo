<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">Booking</text>

  <!-- Service summary card -->
  <rect x="24" y="96" width="342" height="172" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Temple row -->
  <g transform="translate(40, 116)">
    <!-- Temple icon -->
    <path d="M8 2L11 6H5L8 2Z" stroke="#C45B28" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
    <line x1="5" y1="6" x2="5" y2="11" stroke="#C45B28" stroke-width="0.8"/>
    <line x1="8" y1="6" x2="8" y2="11" stroke="#C45B28" stroke-width="0.8"/>
    <line x1="11" y1="6" x2="11" y2="11" stroke="#C45B28" stroke-width="0.8"/>
    <line x1="3" y1="11" x2="13" y2="11" stroke="#C45B28" stroke-width="1"/>
    <g transform="translate(24, 0)">
      <text x="0" y="-2" font-size="10" fill="#9B9590" letter-spacing="0.5">TEMPLE</text>
      <text x="0" y="14" font-size="15" font-weight="600" fill="#1A1A1A">Tirumala Venkateswara Temple</text>
    </g>
  </g>

  <!-- Service row -->
  <g transform="translate(40, 162)">
    <text x="0" y="-2" font-size="10" fill="#9B9590" letter-spacing="0.5">SERVICE</text>
    <text x="0" y="14" font-size="15" font-weight="600" fill="#1A1A1A">Abhishekam</text>
    <text x="0" y="30" font-size="11" fill="#9B9590">Sacred bathing ritual of the deity</text>
  </g>

  <!-- When row -->
  <g transform="translate(40, 218)">
    <text x="0" y="-2" font-size="10" fill="#9B9590" letter-spacing="0.5">WHEN</text>
    <text x="0" y="14" font-size="15" font-weight="600" fill="#1A1A1A">2026-03-01 at 8:00 AM</text>
  </g>

  <!-- Payment summary card -->
  <rect x="24" y="292" width="342" height="160" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="318" font-size="11" fill="#9B9590" letter-spacing="0.8">PAYMENT SUMMARY</text>

  <!-- Seva fee -->
  <text x="40" y="348" font-size="15" fill="#6B6560">Seva fee</text>
  <text x="326" y="348" font-size="15" fill="#1A1A1A" text-anchor="end">&#8377;200</text>

  <!-- Platform fee -->
  <text x="40" y="374" font-size="15" fill="#6B6560">Platform fee (5%)</text>
  <text x="326" y="374" font-size="15" fill="#1A1A1A" text-anchor="end">&#8377;10</text>

  <!-- Divider -->
  <line x1="40" y1="394" x2="326" y2="394" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Total -->
  <text x="40" y="424" font-size="16" font-weight="600" fill="#1A1A1A">Total</text>
  <text x="326" y="424" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="end">&#8377;210</text>

  <!-- Fee note -->
  <text x="24" y="476" font-size="11" fill="#9B9590" line-height="1.4">We only charge for additional services/sevas.</text>
  <text x="24" y="492" font-size="11" fill="#9B9590">Temple donations always go 100% to the temple.</text>

  <!-- Pay button -->
  <rect x="24" y="520" width="342" height="52" rx="10" fill="#C45B28"/>
  <text x="195" y="551" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pay &#8377;210</text>

  <!-- === CONFIRMATION STATE (shown below as overlay preview) === -->
  <line x1="24" y1="600" x2="366" y2="600" stroke="#E8E4DF" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="195" y="622" font-size="10" fill="#9B9590" text-anchor="middle" letter-spacing="1">CONFIRMATION STATE</text>

  <!-- Confirmation icon -->
  <circle cx="195" cy="670" r="30" fill="#E8F5EE"/>
  <path d="M181 670l8 8 18-18" stroke="#2E7D52" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confirmation text -->
  <text x="195" y="722" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">Booking Confirmed</text>
  <text x="195" y="748" font-size="14" fill="#6B6560" text-anchor="middle">Your Abhishekam seva has been booked.</text>
  <text x="195" y="768" font-size="13" fill="#9B9590" text-anchor="middle">2026-03-01 at 8:00 AM</text>

  <!-- Back to home button -->
  <rect x="24" y="788" width="342" height="40" rx="10" fill="#C45B28"/>
  <text x="195" y="813" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Back to Home</text>

  <!-- Home indicator -->
  <rect x="147" y="836" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

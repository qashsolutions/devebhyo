    <!-- Hyderabad -->
    <circle cx="145" cy="125" r="4.5" fill="#1A3A5C" stroke="#FFF" stroke-width="1.5"/>
    <!-- Tirupati (SELECTED) -->
    <circle cx="158" cy="152" r="7" fill="#0D2240" stroke="#FFF" stroke-width="2.5"/>
    <text x="158" y="141" font-size="8" font-weight="700" fill="#0D2240" text-anchor="middle">Tirupati</text>
    <!-- Vijayawada -->

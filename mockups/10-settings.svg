<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">Settings</text>

  <!-- PROFILE section -->
  <text x="28" y="106" font-size="11" fill="#9B9590" letter-spacing="1">PROFILE</text>
  <rect x="24" y="114" width="342" height="120" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <!-- Phone -->
  <g transform="translate(40, 130)">
    <circle cx="7" cy="7" r="6" stroke="#6B6560" stroke-width="1.2" fill="none"/>
    <path d="M3 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#6B6560" stroke-width="1.2" fill="none" transform="scale(0.55) translate(1, -5)"/>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Phone</text>
    <text x="24" y="18" font-size="13" fill="#6B6560">+91 98765 43210</text>
  </g>
  <line x1="40" y1="160" x2="350" y2="160" stroke="#F0ECE8" stroke-width="1"/>
  <!-- DOB -->
  <g transform="translate(40, 170)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Date of birth</text>
    <text x="0" y="18" font-size="13" fill="#6B6560">15/03/1990</text>
  </g>
  <line x1="40" y1="198" x2="350" y2="198" stroke="#F0ECE8" stroke-width="1"/>
  <!-- Name -->
  <g transform="translate(40, 208)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Name</text>
    <text x="0" y="18" font-size="13" fill="#6B6560">Ramesh Sharma</text>
  </g>

  <!-- LANGUAGE section -->
  <text x="28" y="260" font-size="11" fill="#9B9590" letter-spacing="1">LANGUAGE</text>
  <rect x="24" y="268" width="342" height="44" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 284)">
    <!-- Globe icon -->
    <circle cx="8" cy="8" r="6.5" stroke="#6B6560" stroke-width="1.2" fill="none"/>
    <line x1="1.5" y1="8" x2="14.5" y2="8" stroke="#6B6560" stroke-width="0.8"/>
    <path d="M8 1.5c2 2 2.8 4 2.8 6.5s-.8 4.5-2.8 6.5" stroke="#6B6560" stroke-width="0.8" fill="none"/>
    <path d="M8 1.5c-2 2-2.8 4-2.8 6.5s.8 4.5 2.8 6.5" stroke="#6B6560" stroke-width="0.8" fill="none"/>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">App language</text>
    <text x="24" y="18" font-size="13" fill="#6B6560">English</text>
  </g>
  <path d="M346 290l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- VOICE section -->
  <text x="28" y="338" font-size="11" fill="#9B9590" letter-spacing="1">VOICE</text>
  <rect x="24" y="346" width="342" height="44" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 362)">
    <!-- Mic icon -->
    <rect x="4" y="0" width="8" height="12" rx="4" stroke="#6B6560" stroke-width="1.2" fill="none"/>
    <path d="M0 8c0 3 3.5 5 8 5s8-2 8-5" stroke="#6B6560" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <line x1="8" y1="13" x2="8" y2="16" stroke="#6B6560" stroke-width="1.2"/>
    <text x="24" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Voice input</text>
    <text x="24" y="18" font-size="11" fill="#9B9590">Powered by Sarvam AI for Indian languages</text>
  </g>

  <!-- ABOUT section -->
  <text x="28" y="418" font-size="11" fill="#9B9590" letter-spacing="1">ABOUT</text>
  <rect x="24" y="426" width="342" height="120" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <!-- Version -->
  <g transform="translate(40, 444)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Version</text>
    <text x="290" y="4" font-size="13" fill="#6B6560" text-anchor="end">1.0.0</text>
  </g>
  <line x1="40" y1="460" x2="350" y2="460" stroke="#F0ECE8" stroke-width="1"/>
  <!-- Privacy -->
  <g transform="translate(40, 476)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Privacy Policy</text>
    <path d="M326 1l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
  <line x1="40" y1="492" x2="350" y2="492" stroke="#F0ECE8" stroke-width="1"/>
  <!-- Terms -->
  <g transform="translate(40, 510)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Terms of Service</text>
    <path d="M326 1l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Logout button -->
  <rect x="24" y="572" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
  <text x="195" y="601" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">Log Out</text>

  <!-- DANGER ZONE -->
  <text x="28" y="650" font-size="11" fill="#C62828" letter-spacing="1">DANGER ZONE</text>
  <rect x="24" y="658" width="342" height="80" rx="10" fill="#FFFFFF" stroke="#FFEBEE" stroke-width="1"/>
  <g transform="translate(40, 674)">
    <!-- Trash icon -->
    <line x1="2" y1="3" x2="14" y2="3" stroke="#C62828" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M5 3V1.5c0-.3.2-.5.5-.5h5c.3 0 .5.2.5.5V3" stroke="#C62828" stroke-width="1"/>
    <path d="M3 3l.8 12c0 .3.2.5.5.5h7.4c.3 0 .5-.2.5-.5L13 3" stroke="#C62828" stroke-width="1"/>
    <line x1="6.5" y1="6" x2="6.5" y2="12" stroke="#C62828" stroke-width="1" stroke-linecap="round"/>
    <line x1="9.5" y1="6" x2="9.5" y2="12" stroke="#C62828" stroke-width="1" stroke-linecap="round"/>
    <g transform="translate(24, 0)">
      <text x="0" y="4" font-size="14" font-weight="500" fill="#C62828">Delete Account</text>
      <text x="0" y="20" font-size="11" fill="#9B9590">Permanently delete your account and all</text>
      <text x="0" y="34" font-size="11" fill="#9B9590">associated data. This cannot be undone.</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

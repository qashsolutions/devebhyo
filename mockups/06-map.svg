  <!-- Selected temple card -->
  <rect x="24" y="584" width="342" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 596)">
    <circle cx="5" cy="14" r="5" fill="#1A3A5C"/>
    <text x="20" y="10" font-size="15" font-weight="600" fill="#1A1A1A">Tirumala Venkateswara Temple</text>
    <text x="20" y="26" font-size="11" fill="#C45B28">Lord Venkateswara</text>
    <g transform="translate(20, 34)">
      <path d="M4 8c0-2.5 2-4 3.5-4s3.5 1.5 3.5 4-3.5 6.5-3.5 6.5-3.5-4-3.5-6.5z" stroke="#9B9590" stroke-width="0.7" fill="none" transform="scale(0.55)"/>
      <text x="10" y="7" font-size="11" fill="#9B9590">Tirupati, Andhra Pradesh</text>
    </g>
  </g>
  <path d="M346 620l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Hint -->
  <text x="195" y="688" font-size="13" fill="#9B9590" text-anchor="middle">Tap a pin to see details</text>

  <!-- Legend -->
  <g transform="translate(112, 716)">
    <circle cx="4" cy="4" r="4" fill="#1A3A5C"/>
    <text x="14" y="8" font-size="11" fill="#9B9590">Temples (20)</text>

    <circle cx="110" cy="4" r="4" fill="#C45B28"/>
    <text x="120" y="8" font-size="11" fill="#9B9590">Priests (12)</text>
  </g>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

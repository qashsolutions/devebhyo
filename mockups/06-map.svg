<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header: back arrow only (minimal) -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Filter chips -->
  <g transform="translate(24, 92)">
    <!-- All (active) -->
    <rect x="0" y="0" width="36" height="26" rx="13" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <text x="18" y="17" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">All</text>

    <!-- Temples -->
    <rect x="44" y="0" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <circle cx="58" cy="13" r="3" fill="#1A3A5C"/>
    <text x="67" y="17" font-size="11" fill="#9B9590">Temples</text>

    <!-- Priests -->
    <rect x="136" y="0" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <circle cx="150" cy="13" r="3" fill="#C45B28"/>
    <text x="159" y="17" font-size="11" fill="#9B9590">Priests</text>
  </g>

  <!-- Map container -->
  <rect x="24" y="130" width="342" height="440" rx="14" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- India outline (simplified) -->
  <g transform="translate(38, 134)">
    <path d="M110 25 L140 15 L165 30 L200 60 L218 65 L250 60 L260 55 L255 75 L240 90 L220 95 L215 88 L210 100 L200 115 L190 130 L185 140 L180 155 L178 170 L175 190 L170 205 L168 212 L165 208 L158 195 L152 185 L145 175 L138 160 L130 140 L118 120 L108 100 L100 85 L90 80 L80 90 L75 100 L85 120 L90 135 L95 145 L100 160 L110 25Z"
          fill="#F0EDE8" stroke="#D8D3CC" stroke-width="1.2"/>

    <!-- South India highlight -->
    <path d="M108 100 L180 100 L200 115 L190 130 L185 140 L180 155 L178 170 L175 190 L170 205 L168 212 L165 208 L158 195 L152 185 L145 175 L138 160 L130 140 L118 120 L108 100Z"

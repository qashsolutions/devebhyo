<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header with temple identity -->
  <g transform="translate(24, 48)">
    <!-- Temple avatar circle -->
    <circle cx="22" cy="22" r="22" fill="#1A3A5C"/>
    <!-- Temple icon inside -->
    <path d="M22 10l8 6H14l8-6z" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
    <line x1="16" y1="16" x2="16" y2="24" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="19" y1="16" x2="19" y2="24" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="22" y1="16" x2="22" y2="24" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="25" y1="16" x2="25" y2="24" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="28" y1="16" x2="28" y2="24" stroke="#FFFFFF" stroke-width="0.8"/>
    <line x1="13" y1="24" x2="31" y2="24" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Temple name -->
    <text x="54" y="16" font-size="16" font-weight="600" fill="#1A1A1A">Birla Mandir</text>
    <text x="54" y="34" font-size="12" fill="#9B9590">Hyderabad, Telangana</text>
  </g>

  <!-- Settings gear -->
  <circle cx="354" cy="70" r="4" stroke="#9B9590" stroke-width="1.2" fill="none"/>
  <path d="M354 62v2m0 12v2m-6.9-3.5l1.4-1.4m11-11l1.4-1.4m-16 6.4h2m12 0h2m-3.5 6.9l-1.4-1.4m-11-11l-1.4-1.4" stroke="#9B9590" stroke-width="1" stroke-linecap="round"/>

  <!-- Stats row (3 cards) -->
  <g transform="translate(24, 104)">
    <!-- Today's Bookings -->
    <rect x="0" y="0" width="106" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="14" y="24" font-size="24" font-weight="700" fill="#1A3A5C">8</text>
    <text x="14" y="42" font-size="10" fill="#9B9590" letter-spacing="0.5">TODAY'S</text>
    <text x="14" y="56" font-size="10" fill="#9B9590" letter-spacing="0.5">BOOKINGS</text>

    <!-- Month's Donations -->
    <rect x="118" y="0" width="106" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="132" y="24" font-size="20" font-weight="700" fill="#2E7D52">&#8377;45K</text>
    <text x="132" y="42" font-size="10" fill="#9B9590" letter-spacing="0.5">THIS MONTH</text>
    <text x="132" y="56" font-size="10" fill="#9B9590" letter-spacing="0.5">DONATIONS</text>

    <!-- Rating -->
    <rect x="236" y="0" width="106" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="250" y="24" font-size="24" font-weight="700" fill="#B8860B">4.8</text>
    <path d="M290 10l2 4.4 4.7.5-3.4 3.2.8 4.6L290 20.2l-4.1 2.5.8-4.6-3.4-3.2 4.7-.5L290 10z" fill="#B8860B"/>
    <text x="250" y="56" font-size="10" fill="#9B9590" letter-spacing="0.5">RATING</text>
  </g>

  <!-- 100% donation badge -->

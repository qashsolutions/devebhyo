    <!-- Chidambaram -->
    <circle cx="165" cy="165" r="4.5" fill="#1A3A5C" stroke="#FFF" stroke-width="1.5"/>
    <!-- Dharmasthala -->
    <circle cx="128" cy="165" r="4.5" fill="#1A3A5C" stroke="#FFF" stroke-width="1.5"/>


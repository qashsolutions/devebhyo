  <!-- Selected date detail: March 15 -->
  <text x="28" y="468" font-size="11" fill="#9B9590" letter-spacing="1">MARCH 15, SUNDAY -- TIME SLOTS</text>

  <rect x="24" y="478" width="342" height="220" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Time slot 1: Morning -->
  <g transform="translate(40, 498)">
    <text x="0" y="4" font-size="13" font-weight="500" fill="#1A1A1A">6:00 AM -- 9:00 AM</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Early morning rituals</text>
    <!-- Toggle ON -->
    <rect x="264" y="-4" width="40" height="22" rx="11" fill="#2E7D52"/>
    <circle cx="293" cy="7" r="8" fill="#FFFFFF"/>
  </g>
  <line x1="40" y1="528" x2="350" y2="528" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Time slot 2: Mid-morning -->
  <g transform="translate(40, 544)">
    <text x="0" y="4" font-size="13" font-weight="500" fill="#1A1A1A">9:00 AM -- 12:00 PM</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Morning sessions</text>
    <!-- Toggle ON -->
    <rect x="264" y="-4" width="40" height="22" rx="11" fill="#2E7D52"/>
    <circle cx="293" cy="7" r="8" fill="#FFFFFF"/>
  </g>
  <line x1="40" y1="574" x2="350" y2="574" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Time slot 3: Afternoon -->
  <g transform="translate(40, 590)">
    <text x="0" y="4" font-size="13" font-weight="500" fill="#1A1A1A">12:00 PM -- 4:00 PM</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Afternoon sessions</text>
    <!-- Toggle OFF -->
    <rect x="264" y="-4" width="40" height="22" rx="11" fill="#E8E4DF"/>
    <circle cx="275" cy="7" r="8" fill="#FFFFFF"/>
  </g>
  <line x1="40" y1="620" x2="350" y2="620" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Time slot 4: Evening -->

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">My Availability</text>

  <!-- Month header -->
  <g transform="translate(24, 100)">
    <path d="M8 8L2 14L8 20" stroke="#6B6560" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="171" y="18" font-size="17" font-weight="600" fill="#1A1A1A" text-anchor="middle">March 2026</text>
    <path d="M334 8L340 14L334 20" stroke="#6B6560" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Calendar grid -->
  <rect x="24" y="130" width="342" height="280" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Day headers -->
  <g transform="translate(24, 152)" font-size="11" font-weight="500" fill="#9B9590" text-anchor="middle">
    <text x="24">Su</text>
    <text x="73">Mo</text>
    <text x="122">Tu</text>
    <text x="171">We</text>
    <text x="220">Th</text>
    <text x="269">Fr</text>
    <text x="318">Sa</text>
  </g>

  <!-- Week 1: March starts on Sunday -->
  <g transform="translate(24, 174)" font-size="14" fill="#1A1A1A" text-anchor="middle">
    <!-- Mar 1 (Sun) - available -->
    <circle cx="24" cy="14" r="16" fill="#E8F5EE"/>
    <text x="24" y="19" font-weight="500" fill="#2E7D52">1</text>
    <!-- Mar 2 - available -->
    <circle cx="73" cy="14" r="16" fill="#E8F5EE"/>
    <text x="73" y="19" font-weight="500" fill="#2E7D52">2</text>
    <!-- Mar 3 - available -->
    <circle cx="122" cy="14" r="16" fill="#E8F5EE"/>
    <text x="122" y="19" font-weight="500" fill="#2E7D52">3</text>
    <!-- Mar 4 - blocked -->
    <circle cx="171" cy="14" r="16" fill="#FFEBEE"/>
    <text x="171" y="19" font-weight="500" fill="#C62828">4</text>
    <!-- Mar 5 - available -->
    <circle cx="220" cy="14" r="16" fill="#E8F5EE"/>
    <text x="220" y="19" font-weight="500" fill="#2E7D52">5</text>
    <!-- Mar 6 - available -->
    <circle cx="269" cy="14" r="16" fill="#E8F5EE"/>
    <text x="269" y="19" font-weight="500" fill="#2E7D52">6</text>
    <!-- Mar 7 - available -->
    <circle cx="318" cy="14" r="16" fill="#E8F5EE"/>
    <text x="318" y="19" font-weight="500" fill="#2E7D52">7</text>
  </g>

  <!-- Week 2 -->
  <g transform="translate(24, 216)" font-size="14" fill="#1A1A1A" text-anchor="middle">
    <text x="24" y="19">8</text>
    <text x="73" y="19">9</text>
    <text x="122" y="19">10</text>
    <text x="171" y="19">11</text>
    <circle cx="220" cy="14" r="16" fill="#FFEBEE"/>
    <text x="220" y="19" font-weight="500" fill="#C62828">12</text>
    <text x="269" y="19">13</text>
    <text x="318" y="19">14</text>
  </g>

  <!-- Week 3 - selected date: Mar 15 -->
  <g transform="translate(24, 258)" font-size="14" fill="#1A1A1A" text-anchor="middle">
    <!-- Mar 15: selected -->
    <circle cx="24" cy="14" r="16" fill="#C45B28"/>
    <text x="24" y="19" font-weight="600" fill="#FFFFFF">15</text>
    <text x="73" y="19">16</text>
    <text x="122" y="19">17</text>
    <text x="171" y="19">18</text>
    <text x="220" y="19">19</text>
    <text x="269" y="19">20</text>
    <text x="318" y="19">21</text>
  </g>

  <!-- Week 4 -->
  <g transform="translate(24, 300)" font-size="14" fill="#1A1A1A" text-anchor="middle">
    <text x="24" y="19">22</text>
    <text x="73" y="19">23</text>
    <text x="122" y="19">24</text>
    <text x="171" y="19">25</text>
    <text x="220" y="19">26</text>
    <text x="269" y="19">27</text>

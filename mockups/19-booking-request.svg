<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">Booking Request</text>

  <!-- New request badge -->
  <rect x="24" y="96" width="342" height="36" rx="8" fill="#FFF8E7"/>
  <text x="195" y="119" font-size="12" font-weight="500" fill="#B8860B" text-anchor="middle">New request  ·  Received 15 minutes ago</text>

  <!-- Devotee info card -->
  <text x="28" y="162" font-size="11" fill="#9B9590" letter-spacing="1">DEVOTEE</text>
  <rect x="24" y="172" width="342" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 192)">
    <!-- Avatar -->
    <circle cx="18" cy="14" r="18" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="1"/>
    <text x="18" y="19" font-size="13" font-weight="600" fill="#C45B28" text-anchor="middle">SK</text>
    <!-- Name and phone -->
    <text x="46" y="6" font-size="15" font-weight="600" fill="#1A1A1A">Suresh Kumar</text>
    <text x="46" y="24" font-size="12" fill="#9B9590">+91 99887 66543  ·  Jubilee Hills, Hyderabad</text>
  </g>

  <!-- Service details card -->
  <text x="28" y="274" font-size="11" fill="#9B9590" letter-spacing="1">SERVICE DETAILS</text>
  <rect x="24" y="284" width="342" height="196" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Seva type -->
  <g transform="translate(40, 306)">
    <text x="0" y="0" font-size="10" fill="#9B9590" letter-spacing="0.8">SEVA</text>
    <text x="0" y="18" font-size="16" font-weight="600" fill="#1A1A1A">Grihapravesam Pooja</text>
    <text x="0" y="34" font-size="11" fill="#9B9590">Housewarming ceremony and blessing</text>
  </g>
  <line x1="40" y1="352" x2="350" y2="352" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Date & Time -->
  <g transform="translate(40, 368)">
    <text x="0" y="0" font-size="10" fill="#9B9590" letter-spacing="0.8">REQUESTED DATE &amp; TIME</text>
    <text x="0" y="18" font-size="15" font-weight="600" fill="#1A1A1A">5 March 2026, 10:00 AM</text>
    <text x="0" y="34" font-size="11" fill="#2E7D52">&#10003; You are available at this time</text>
  </g>
  <line x1="40" y1="414" x2="350" y2="414" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Location -->
  <g transform="translate(40, 430)">
    <text x="0" y="0" font-size="10" fill="#9B9590" letter-spacing="0.8">LOCATION</text>
    <text x="0" y="18" font-size="15" font-weight="600" fill="#1A1A1A">Jubilee Hills, Hyderabad</text>
    <text x="0" y="34" font-size="11" fill="#9B9590">5.2 km from your location</text>
  </g>

  <!-- Fee card -->
  <text x="28" y="512" font-size="11" fill="#9B9590" letter-spacing="1">EARNINGS</text>
  <rect x="24" y="522" width="342" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(40, 542)">
    <text x="0" y="0" font-size="13" fill="#6B6560">Your fee for this session</text>
    <text x="0" y="24" font-size="24" font-weight="700" fill="#2E7D52">&#8377;3,500</text>
    <text x="100" y="24" font-size="12" fill="#9B9590">Estimated 2-3 hours</text>
  </g>

  <!-- Notes from devotee -->
  <text x="28" y="624" font-size="11" fill="#9B9590" letter-spacing="1">NOTE FROM DEVOTEE</text>
  <rect x="24" y="634" width="342" height="56" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1" stroke-dasharray="4,4"/>
  <g transform="translate(40, 654)">
    <text x="0" y="4" font-size="13" fill="#6B6560">"We are moving into our new home. Please</text>
    <text x="0" y="20" font-size="13" fill="#6B6560"> bring all required pooja materials."</text>
  </g>

  <!-- Action buttons -->
  <g transform="translate(24, 716)">
    <!-- Decline button -->
    <rect x="0" y="0" width="166" height="48" rx="10" fill="#FFFFFF" stroke="#C62828" stroke-width="1.5"/>
    <text x="83" y="29" font-size="15" font-weight="600" fill="#C62828" text-anchor="middle">Decline</text>
    <!-- Accept button -->
    <rect x="176" y="0" width="166" height="48" rx="10" fill="#2E7D52"/>
    <text x="259" y="29" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Accept</text>
  </g>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>
  <rect x="24" y="268" width="342" height="180" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Seva 1 -->
  <g transform="translate(40, 286)">
    <rect x="0" y="-4" width="52" height="20" rx="4" fill="#FFF8E7"/>
    <text x="26" y="10" font-size="10" font-weight="500" fill="#B8860B" text-anchor="middle">6:00 AM</text>
    <text x="64" y="10" font-size="14" font-weight="500" fill="#1A1A1A">Suprabhatam</text>
    <text x="260" y="10" font-size="12" fill="#9B9590" text-anchor="end">3 devotees</text>
  </g>
  <line x1="40" y1="314" x2="350" y2="314" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Seva 2 -->
  <g transform="translate(40, 328)">
    <rect x="0" y="-4" width="52" height="20" rx="4" fill="#FFF8E7"/>
    <text x="26" y="10" font-size="10" font-weight="500" fill="#B8860B" text-anchor="middle">8:00 AM</text>
    <text x="64" y="10" font-size="14" font-weight="500" fill="#1A1A1A">Abhishekam</text>
    <text x="260" y="10" font-size="12" fill="#9B9590" text-anchor="end">2 devotees</text>
  </g>
  <line x1="40" y1="356" x2="350" y2="356" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Seva 3 -->
  <g transform="translate(40, 370)">
    <rect x="0" y="-4" width="54" height="20" rx="4" fill="#FFF8E7"/>
    <text x="27" y="10" font-size="10" font-weight="500" fill="#B8860B" text-anchor="middle">10:00 AM</text>
    <text x="66" y="10" font-size="14" font-weight="500" fill="#1A1A1A">Archana</text>
    <text x="260" y="10" font-size="12" fill="#9B9590" text-anchor="end">5 devotees</text>
  </g>
  <line x1="40" y1="398" x2="350" y2="398" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Seva 4 -->
  <g transform="translate(40, 412)">
    <rect x="0" y="-4" width="52" height="20" rx="4" fill="#FFF8E7"/>
    <text x="26" y="10" font-size="10" font-weight="500" fill="#B8860B" text-anchor="middle">6:00 PM</text>
    <text x="64" y="10" font-size="14" font-weight="500" fill="#1A1A1A">Homam</text>
    <text x="260" y="10" font-size="12" fill="#9B9590" text-anchor="end">1 devotee</text>
  </g>

  <!-- Recent Donations section -->

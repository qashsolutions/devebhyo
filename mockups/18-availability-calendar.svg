    <text x="0" y="4" font-size="13" font-weight="500" fill="#1A1A1A">4:00 PM -- 8:00 PM</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Evening rituals</text>
    <!-- Toggle ON -->
    <rect x="264" y="-4" width="40" height="22" rx="11" fill="#2E7D52"/>
    <circle cx="293" cy="7" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Save button -->
  <rect x="24" y="716" width="342" height="48" rx="10" fill="#C45B28"/>
  <text x="195" y="745" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save Availability</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>
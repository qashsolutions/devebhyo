    <!-- Rameswaram -->
    <circle cx="160" cy="192" r="4.5" fill="#1A3A5C" stroke="#FFF" stroke-width="1.5"/>
    <!-- Thanjavur -->
    <circle cx="162" cy="170" r="4.5" fill="#1A3A5C" stroke="#FFF" stroke-width="1.5"/>
    <!-- Mysore -->

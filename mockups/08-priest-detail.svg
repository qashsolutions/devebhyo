<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">Priest</text>

  <!-- Avatar -->
  <circle cx="195" cy="130" r="36" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1.5"/>
  <text x="195" y="140" font-size="24" font-weight="600" fill="#C45B28" text-anchor="middle">PD</text>

  <!-- Name -->
  <text x="195" y="192" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle" letter-spacing="-0.3">Sri Padmanabha Dikshitar</text>

  <!-- Location -->
  <g transform="translate(145, 204)">
    <path d="M6 10c0-3 2.5-5.5 5-5.5s5 2.5 5 5.5-5 9-5 9-5-6-5-9z" stroke="#6B6560" stroke-width="1" fill="none" transform="scale(0.55)"/>
    <text x="12" y="9" font-size="13" fill="#6B6560">Tirupati, Andhra Pradesh</text>
  </g>

  <!-- Stats card -->
  <rect x="24" y="228" width="342" height="56" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <g transform="translate(24, 228)">
    <!-- Rating -->
    <g transform="translate(0, 0)">
      <path d="M57 14l2 4.4 4.7.5-3.3 3.2.8 4.5L57 24.4l-4.2 2.2.8-4.5-3.3-3.2 4.7-.5L57 14z" fill="#B8860B" transform="scale(0.7) translate(29, 6)"/>
      <text x="57" y="34" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">5.0</text>
      <text x="57" y="48" font-size="11" fill="#9B9590" text-anchor="middle">Rating</text>
    </g>
    <line x1="114" y1="10" x2="114" y2="48" stroke="#F0ECE8" stroke-width="1"/>
    <!-- Experience -->
    <text x="171" y="34" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">25</text>
    <text x="171" y="48" font-size="11" fill="#9B9590" text-anchor="middle">Years</text>
    <line x1="228" y1="10" x2="228" y2="48" stroke="#F0ECE8" stroke-width="1"/>
    <!-- Rate -->
    <text x="285" y="34" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">&#8377;3,000</text>
    <text x="285" y="48" font-size="11" fill="#9B9590" text-anchor="middle">Per session</text>
  </g>

  <!-- Bio -->
  <text x="24" y="310" font-size="14" fill="#6B6560" line-height="1.5">Hereditary priest trained in the Vaikhanasa</text>
  <text x="24" y="328" font-size="14" fill="#6B6560">Agama tradition, serving at the Tirumala</text>
  <text x="24" y="346" font-size="14" fill="#6B6560">temple for over two decades.</text>

  <!-- Languages -->
  <text x="24" y="378" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.5">LANGUAGES</text>
  <g transform="translate(24, 388)">
    <rect x="0" y="0" width="55" height="24" rx="12" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="27" y="16" font-size="11" fill="#6B6560" text-anchor="middle">Telugu</text>
    <rect x="63" y="0" width="48" height="24" rx="12" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="87" y="16" font-size="11" fill="#6B6560" text-anchor="middle">Tamil</text>
    <rect x="119" y="0" width="60" height="24" rx="12" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="149" y="16" font-size="11" fill="#6B6560" text-anchor="middle">Sanskrit</text>
    <rect x="187" y="0" width="56" height="24" rx="12" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="215" y="16" font-size="11" fill="#6B6560" text-anchor="middle">English</text>
  </g>

  <!-- Specializations -->
  <text x="24" y="436" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.5">SPECIALIZATIONS</text>
  <g transform="translate(24, 446)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#FFF8E7"/>
    <text x="60" y="16" font-size="11" fill="#B8860B" text-anchor="middle">Vaikhanasa Agama</text>
    <rect x="128" y="0" width="95" height="24" rx="12" fill="#FFF8E7"/>
    <text x="175" y="16" font-size="11" fill="#B8860B" text-anchor="middle">Suprabhatam</text>
    <rect x="0" y="30" width="108" height="24" rx="12" fill="#FFF8E7"/>
    <text x="54" y="46" font-size="11" fill="#B8860B" text-anchor="middle">Kalyanotsavam</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="510" x2="366" y2="510" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Booking section -->
  <text x="24" y="538" font-size="20" font-weight="600" fill="#1A1A1A">Book 1:1 Session</text>

  <!-- Date label -->
  <text x="24" y="568" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.5">SELECT DATE</text>

  <!-- Date cards -->
  <g transform="translate(24, 578)">
    <rect x="0" y="0" width="56" height="60" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="28" y="18" font-size="10" fill="#9B9590" text-anchor="middle">Fri</text>
    <text x="28" y="36" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">28</text>
    <text x="28" y="50" font-size="10" fill="#9B9590" text-anchor="middle">Feb</text>

    <rect x="64" y="0" width="56" height="60" rx="10" fill="#C45B28"/>
    <text x="92" y="18" font-size="10" fill="#FFFFFF" text-anchor="middle">Sat</text>
    <text x="92" y="36" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="92" y="50" font-size="10" fill="#FFFFFF" text-anchor="middle">Mar</text>

    <rect x="128" y="0" width="56" height="60" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="156" y="18" font-size="10" fill="#9B9590" text-anchor="middle">Sun</text>
    <text x="156" y="36" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">2</text>
    <text x="156" y="50" font-size="10" fill="#9B9590" text-anchor="middle">Mar</text>

    <rect x="192" y="0" width="56" height="60" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="220" y="18" font-size="10" fill="#9B9590" text-anchor="middle">Mon</text>
    <text x="220" y="36" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">3</text>
    <text x="220" y="50" font-size="10" fill="#9B9590" text-anchor="middle">Mar</text>

    <rect x="256" y="0" width="56" height="60" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="284" y="18" font-size="10" fill="#9B9590" text-anchor="middle">Tue</text>
    <text x="284" y="36" font-size="16" font-weight="600" fill="#1A1A1A" text-anchor="middle">4</text>
    <text x="284" y="50" font-size="10" fill="#9B9590" text-anchor="middle">Mar</text>
  </g>

  <!-- Time label -->
  <text x="24" y="660" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.5">SELECT TIME</text>

  <!-- Time slots -->
  <g transform="translate(24, 670)">
    <rect x="0" y="0" width="72" height="30" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="36" y="20" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">6:00 AM</text>

    <rect x="80" y="0" width="72" height="30" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="116" y="20" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">7:00 AM</text>

    <rect x="160" y="0" width="72" height="30" rx="6" fill="#C45B28"/>
    <text x="196" y="20" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">8:00 AM</text>

    <rect x="240" y="0" width="72" height="30" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="276" y="20" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">9:00 AM</text>

    <rect x="0" y="38" width="76" height="30" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="38" y="58" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">10:00 AM</text>

    <rect x="84" y="38" width="76" height="30" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="122" y="58" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">4:00 PM</text>

    <rect x="168" y="38" width="72" height="30" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="204" y="58" font-size="12" font-weight="500" fill="#1A1A1A" text-anchor="middle">5:00 PM</text>
  </g>

  <!-- Book button -->
  <rect x="24" y="778" width="342" height="48" rx="10" fill="#C45B28"/>
  <text x="195" y="807" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book Session -- &#8377;3,000</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

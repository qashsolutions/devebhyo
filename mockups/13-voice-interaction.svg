<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background (slightly darker for overlay feel) -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Close button -->
  <circle cx="354" cy="62" r="16" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
  <path d="M348 56l12 12m0-12l-12 12" stroke="#6B6560" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Language selector -->
  <rect x="144" y="50" width="102" height="28" rx="14" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
  <!-- Globe icon -->
  <circle cx="162" cy="64" r="5" stroke="#C45B28" stroke-width="1" fill="none"/>
  <line x1="157" y1="64" x2="167" y2="64" stroke="#C45B28" stroke-width="0.6"/>
  <path d="M162 59c1.5 1.5 2 3 2 5s-.5 3.5-2 5" stroke="#C45B28" stroke-width="0.6" fill="none"/>
  <path d="M162 59c-1.5 1.5-2 3-2 5s.5 3.5 2 5" stroke="#C45B28" stroke-width="0.6" fill="none"/>
  <text x="173" y="68" font-size="12" font-weight="500" fill="#C45B28">Telugu</text>
  <path d="M226 61l4 4-4 4" stroke="#C45B28" stroke-width="1" fill="none" stroke-linecap="round" transform="translate(-6, 0) rotate(90 226 64)"/>

  <!-- Pulse rings (listening animation) -->
  <circle cx="195" cy="300" r="80" fill="none" stroke="#C45B28" stroke-width="1" opacity="0.08"/>
  <circle cx="195" cy="300" r="64" fill="none" stroke="#C45B28" stroke-width="1.5" opacity="0.15"/>
  <circle cx="195" cy="300" r="48" fill="none" stroke="#C45B28" stroke-width="2" opacity="0.25"/>

  <!-- Mic circle -->
  <circle cx="195" cy="300" r="40" fill="#C45B28"/>

  <!-- Mic icon (white) -->
  <rect x="188" y="282" width="14" height="22" rx="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <path d="M180 298c0 7.5 6.7 13 15 13s15-5.5 15-13" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="195" y1="311" x2="195" y2="317" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="189" y1="317" x2="201" y2="317" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Listening indicator -->
  <text x="195" y="368" font-size="15" font-weight="500" fill="#C45B28" text-anchor="middle">Listening...</text>

  <!-- Waveform visualization (sound bars) -->
  <g transform="translate(155, 390)">
    <rect x="0" y="6" width="3" height="8" rx="1.5" fill="#C45B28" opacity="0.4"/>
    <rect x="8" y="3" width="3" height="14" rx="1.5" fill="#C45B28" opacity="0.5"/>
    <rect x="16" y="0" width="3" height="20" rx="1.5" fill="#C45B28" opacity="0.7"/>
    <rect x="24" y="2" width="3" height="16" rx="1.5" fill="#C45B28" opacity="0.9"/>
    <rect x="32" y="0" width="3" height="20" rx="1.5" fill="#C45B28"/>
    <rect x="40" y="4" width="3" height="12" rx="1.5" fill="#C45B28" opacity="0.8"/>
    <rect x="48" y="1" width="3" height="18" rx="1.5" fill="#C45B28" opacity="0.6"/>
    <rect x="56" y="3" width="3" height="14" rx="1.5" fill="#C45B28" opacity="0.7"/>
    <rect x="64" y="6" width="3" height="8" rx="1.5" fill="#C45B28" opacity="0.5"/>
    <rect x="72" y="4" width="3" height="12" rx="1.5" fill="#C45B28" opacity="0.4"/>
  </g>

  <!-- Transcript card -->
  <rect x="24" y="440" width="342" height="100" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="464" font-size="10" fill="#9B9590" letter-spacing="0.8">HEARD</text>
  <text x="40" y="486" font-size="16" font-weight="500" fill="#1A1A1A">"Tirumala lo Abhishekam</text>
  <text x="40" y="506" font-size="16" font-weight="500" fill="#1A1A1A"> book cheyandi"</text>
  <!-- Cursor blink -->
  <rect x="213" y="494" width="2" height="16" rx="1" fill="#C45B28" opacity="0.6"/>

  <!-- Translation -->
  <rect x="24" y="552" width="342" height="44" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="40" y="572" font-size="11" fill="#9B9590" letter-spacing="0.5">EN:</text>
  <text x="60" y="572" font-size="13" fill="#6B6560">"Book Abhishekam at Tirumala"</text>
  <text x="332" y="572" font-size="11" fill="#2E7D52" text-anchor="end">&#10003; Understood</text>

  <!-- Suggestion chips -->
  <text x="28" y="624" font-size="10" fill="#9B9590" letter-spacing="0.8">TRY SAYING</text>

  <g transform="translate(24, 636)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="14" y="21" font-size="12" fill="#6B6560">"Nearest temple chupinchandi"</text>
  </g>
  <g transform="translate(222, 636)">
    <rect x="0" y="0" width="144" height="32" rx="16" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="14" y="21" font-size="12" fill="#6B6560">"Pandit kavali"</text>
  </g>
  <g transform="translate(24, 676)">
    <rect x="0" y="0" width="176" height="32" rx="16" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="14" y="21" font-size="12" fill="#6B6560">"Naa bookings chupinchu"</text>
  </g>
  <g transform="translate(208, 676)">
    <rect x="0" y="0" width="158" height="32" rx="16" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="14" y="21" font-size="12" fill="#6B6560">"Donate &#8377;500"</text>
  </g>

  <!-- Powered by Sarvam AI -->
  <text x="195" y="746" font-size="10" fill="#9B9590" text-anchor="middle">Powered by Sarvam AI for Indian languages</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- Header -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="72" font-size="14" font-weight="500" fill="#6B6560" text-anchor="middle">Temple</text>

  <!-- Temple name -->
  <text x="24" y="118" font-size="22" font-weight="600" fill="#1A1A1A" letter-spacing="-0.3">Tirumala Venkateswara</text>
  <text x="24" y="144" font-size="22" font-weight="600" fill="#1A1A1A" letter-spacing="-0.3">Temple</text>
  <text x="24" y="168" font-size="15" fill="#C45B28">Lord Venkateswara</text>

  <!-- Location -->
  <g transform="translate(24, 188)">
    <path d="M6 12c0-3.3 2.7-6 6-6s6 2.7 6 6c0 5.5-6 11.5-6 11.5s-6-6-6-11.5z" stroke="#6B6560" stroke-width="1.3" fill="none" transform="scale(0.65) translate(0,-2)"/>
    <circle cx="4" cy="6" r="1.5" stroke="#6B6560" stroke-width="1" fill="none" transform="translate(3.9, 0.5)"/>
    <text x="22" y="12" font-size="13" fill="#6B6560">Tirumala, Tirupati, Andhra Pradesh 517504</text>
  </g>

  <!-- Timings -->
  <g transform="translate(24, 216)">
    <circle cx="8" cy="7" r="6.5" stroke="#6B6560" stroke-width="1.3" fill="none"/>
    <path d="M8 4v3.5l2.5 2" stroke="#6B6560" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <text x="22" y="12" font-size="13" fill="#6B6560">3:00 AM - 12:00 AM</text>
  </g>

  <!-- Description card -->
  <rect x="24" y="248" width="342" height="72" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="270" font-size="13" fill="#6B6560">The richest and most visited temple in the</text>
  <text x="40" y="288" font-size="13" fill="#6B6560">world. Nestled in the seven hills of Tirumala,</text>
  <text x="40" y="306" font-size="13" fill="#6B6560">drawing over 50,000 devotees daily.</text>

  <!-- Divider -->
  <line x1="24" y1="340" x2="366" y2="340" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Services header -->
  <text x="24" y="368" font-size="20" font-weight="600" fill="#1A1A1A">Services</text>
  <text x="24" y="386" font-size="11" fill="#2E7D52">Temple donations go 100% to the temple</text>

  <!-- ARCHANA category -->
  <text x="24" y="418" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.8">ARCHANA</text>
  <rect x="24" y="426" width="342" height="52" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="449" font-size="14" font-weight="500" fill="#1A1A1A">Archana</text>
  <text x="40" y="465" font-size="11" fill="#9B9590">Sacred chanting of the deity's names</text>
  <text x="316" y="449" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="end">&#8377;50</text>
  <path d="M332 446l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- ABHISHEKAM category -->
  <text x="24" y="502" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.8">ABHISHEKAM</text>
  <rect x="24" y="510" width="342" height="52" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="533" font-size="14" font-weight="500" fill="#1A1A1A">Abhishekam</text>
  <text x="40" y="549" font-size="11" fill="#9B9590">Sacred bathing ritual of the deity</text>
  <text x="316" y="533" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="end">&#8377;200</text>
  <path d="M332 530l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- HOMAM category -->
  <text x="24" y="586" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.8">HOMAM</text>
  <rect x="24" y="594" width="342" height="52" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="617" font-size="14" font-weight="500" fill="#1A1A1A">Homam</text>
  <text x="40" y="633" font-size="11" fill="#9B9590">Sacred fire ritual</text>
  <text x="316" y="617" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="end">&#8377;500</text>
  <path d="M332 614l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- DONATION category -->
  <text x="24" y="670" font-size="12" font-weight="500" fill="#9B9590" letter-spacing="0.8">DONATION</text>
  <rect x="24" y="678" width="342" height="52" rx="6" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
  <text x="40" y="701" font-size="14" font-weight="500" fill="#1A1A1A">Temple Donation</text>
  <text x="40" y="717" font-size="11" fill="#9B9590">100% goes directly to the temple</text>
  <text x="316" y="701" font-size="13" fill="#2E7D52" text-anchor="end" font-style="italic">Any amount</text>
  <path d="M332 698l5 5-5 5" stroke="#9B9590" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- View on Map button -->
  <rect x="24" y="754" width="342" height="48" rx="10" fill="none" stroke="#C45B28" stroke-width="1.5"/>
  <text x="195" y="783" font-size="15" font-weight="600" fill="#C45B28" text-anchor="middle">View on Map</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

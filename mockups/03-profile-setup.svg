<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>

  <!-- User icon circle -->
  <circle cx="56" cy="104" r="28" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
  <circle cx="56" cy="98" r="6" stroke="#C45B28" stroke-width="1.5" fill="none"/>
  <path d="M44 116c0-5.5 5-10 12-10s12 4.5 12 10" stroke="#C45B28" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Title -->
  <text x="24" y="168" font-size="24" font-weight="600" fill="#1A1A1A" letter-spacing="-0.3">Your details</text>
  <text x="24" y="192" font-size="15" fill="#6B6560">Helps us personalize services for you</text>

  <!-- Name field -->
  <g transform="translate(24, 228)">
    <text x="0" y="0" font-size="14" font-weight="500" fill="#1A1A1A">Name <tspan font-size="11" fill="#9B9590" font-weight="400">(optional)</tspan></text>
    <rect x="0" y="12" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="16" y="42" font-size="15" fill="#1A1A1A">Ramesh Sharma</text>
  </g>

  <!-- DOB field -->
  <g transform="translate(24, 318)">
    <text x="0" y="0" font-size="14" font-weight="500" fill="#1A1A1A">Date of birth <tspan font-size="14" fill="#C62828">*</tspan></text>
    <rect x="0" y="12" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <!-- Calendar icon -->
    <rect x="16" y="28" width="14" height="14" rx="2" stroke="#6B6560" stroke-width="1" fill="none"/>
    <line x1="16" y1="33" x2="30" y2="33" stroke="#6B6560" stroke-width="1"/>
    <line x1="20" y1="26" x2="20" y2="29" stroke="#6B6560" stroke-width="1"/>
    <line x1="26" y1="26" x2="26" y2="29" stroke="#6B6560" stroke-width="1"/>
    <text x="40" y="43" font-size="15" fill="#1A1A1A">15/03/1990</text>
    <text x="0" y="74" font-size="11" fill="#9B9590">35 years</text>
  </g>

  <!-- Gotra field -->
  <g transform="translate(24, 422)">
    <text x="0" y="0" font-size="14" font-weight="500" fill="#1A1A1A">Gotra <tspan font-size="11" fill="#9B9590" font-weight="400">(optional)</tspan></text>
    <rect x="0" y="12" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="16" y="42" font-size="15" fill="#9B9590">e.g., Bharadwaja, Kashyapa</text>
  </g>

  <!-- Nakshatra field -->
  <g transform="translate(24, 512)">
    <text x="0" y="0" font-size="14" font-weight="500" fill="#1A1A1A">Nakshatra <tspan font-size="11" fill="#9B9590" font-weight="400">(optional)</tspan></text>
    <rect x="0" y="12" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="16" y="42" font-size="15" fill="#9B9590">e.g., Ashwini, Rohini</text>
  </g>

  <!-- Marital Status (shown because age >= 18) -->
  <g transform="translate(24, 602)">
    <text x="0" y="0" font-size="14" font-weight="500" fill="#1A1A1A">Marital status <tspan font-size="11" fill="#9B9590" font-weight="400">(optional)</tspan></text>
    <!-- Single toggle -->
    <rect x="0" y="16" width="90" height="40" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="45" y="41" font-size="14" font-weight="500" fill="#1A1A1A" text-anchor="middle">Single</text>
    <!-- Married toggle (active) -->
    <rect x="102" y="16" width="96" height="40" rx="10" fill="#C45B28"/>
    <text x="150" y="41" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Married</text>
  </g>

  <!-- Children (shown because married) -->
  <g transform="translate(24, 682)">
    <text x="0" y="0" font-size="14" font-weight="500" fill="#1A1A1A">Number of children <tspan font-size="11" fill="#9B9590" font-weight="400">(optional)</tspan></text>
    <rect x="0" y="12" width="80" height="48" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="40" y="42" font-size="15" fill="#1A1A1A" text-anchor="middle">2</text>
  </g>

  <!-- Continue button -->
  <rect x="24" y="758" width="342" height="52" rx="10" fill="#C45B28"/>
  <text x="195" y="789" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

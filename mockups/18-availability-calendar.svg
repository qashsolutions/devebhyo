    <circle cx="318" cy="14" r="16" fill="#FFF8E7"/>
    <text x="318" y="19" font-weight="500" fill="#B8860B">28</text>
  </g>

  <!-- Week 5 -->
  <g transform="translate(24, 342)" font-size="14" fill="#1A1A1A" text-anchor="middle">
    <text x="24" y="19">29</text>
    <text x="73" y="19">30</text>
    <text x="122" y="19">31</text>
    <text x="171" y="19" fill="#9B9590">1</text>
    <text x="220" y="19" fill="#9B9590">2</text>
    <text x="269" y="19" fill="#9B9590">3</text>
    <text x="318" y="19" fill="#9B9590">4</text>
  </g>

  <!-- Legend -->
  <g transform="translate(24, 426)">
    <circle cx="8" cy="6" r="6" fill="#E8F5EE"/>
    <text x="20" y="10" font-size="11" fill="#6B6560">Available</text>
    <circle cx="100" cy="6" r="6" fill="#FFEBEE"/>
    <text x="112" y="10" font-size="11" fill="#6B6560">Blocked</text>
    <circle cx="184" cy="6" r="6" fill="#FFF8E7"/>
    <text x="196" y="10" font-size="11" fill="#6B6560">Booked</text>
    <circle cx="260" cy="6" r="6" fill="#C45B28"/>
    <text x="272" y="10" font-size="11" fill="#6B6560">Selected</text>

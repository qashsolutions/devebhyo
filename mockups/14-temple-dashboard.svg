  <text x="342" y="480" font-size="11" fill="#C45B28" font-weight="500" text-anchor="end">View All</text>
  <rect x="24" y="490" width="342" height="140" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Donation 1 -->
  <g transform="translate(40, 508)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Ramesh Sharma</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Today, 7:32 AM</text>
    <text x="290" y="10" font-size="14" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;1,000</text>
  </g>
  <line x1="40" y1="536" x2="350" y2="536" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Donation 2 -->
  <g transform="translate(40, 548)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Anonymous</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Today, 6:15 AM</text>
    <text x="290" y="10" font-size="14" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;500</text>
  </g>
  <line x1="40" y1="576" x2="350" y2="576" stroke="#F0ECE8" stroke-width="1"/>

  <!-- Donation 3 -->
  <g transform="translate(40, 588)">
    <text x="0" y="4" font-size="14" font-weight="500" fill="#1A1A1A">Priya Reddy</text>
    <text x="0" y="20" font-size="11" fill="#9B9590">Yesterday, 4:45 PM</text>
    <text x="290" y="10" font-size="14" font-weight="600" fill="#2E7D52" text-anchor="end">&#8377;2,100</text>
  </g>

  <!-- Quick Actions -->
  <text x="28" y="660" font-size="11" fill="#9B9590" letter-spacing="1">QUICK ACTIONS</text>

  <g transform="translate(24, 672)">
    <!-- Manage Sevas -->
    <rect x="0" y="0" width="166" height="48" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="83" y="29" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Manage Sevas</text>
    <!-- Donation Ledger -->
    <rect x="176" y="0" width="166" height="48" rx="10" fill="#FFFFFF" stroke="#F0ECE8" stroke-width="1"/>
    <text x="259" y="29" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Donation Ledger</text>
  </g>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>

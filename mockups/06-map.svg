    <!-- Warangal priest -->
    <circle cx="158" cy="116" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Tirupati priest -->
    <circle cx="155" cy="155" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Vijayawada priest -->
    <circle cx="165" cy="135" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Madurai priest -->
    <circle cx="154" cy="183" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Thanjavur priest -->
    <circle cx="159" cy="173" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Mysore priest -->
    <circle cx="137" cy="173" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Mumbai priest -->
    <circle cx="102" cy="113" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>
    <!-- Nashik priest -->
    <circle cx="115" cy="97" r="4" fill="#C45B28" stroke="#FFF" stroke-width="1.5"/>

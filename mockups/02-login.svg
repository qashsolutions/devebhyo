<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>
  <rect x="310" y="12" width="22" height="10" rx="2" stroke="#1A1A1A" stroke-width="1" fill="none"/>
  <rect x="312" y="14" width="14" height="6" rx="1" fill="#1A1A1A"/>

  <!-- Back arrow -->
  <path d="M38 62L30 70L38 78" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Phone icon circle -->
  <circle cx="56" cy="136" r="28" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
  <rect x="47" y="125" width="18" height="22" rx="3" stroke="#C45B28" stroke-width="1.5" fill="none"/>
  <line x1="52" y1="141" x2="60" y2="141" stroke="#C45B28" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Title -->
  <text x="24" y="206" font-size="24" font-weight="600" fill="#1A1A1A" letter-spacing="-0.3">Enter your phone number</text>
  <text x="24" y="232" font-size="15" fill="#6B6560">We will send a verification code via SMS</text>

  <!-- Phone input row -->
  <g transform="translate(24, 272)">
    <!-- Country code -->
    <rect x="0" y="0" width="70" height="52" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="35" y="32" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">+91</text>

    <!-- Phone input -->
    <rect x="82" y="0" width="260" height="52" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="98" y="32" font-size="15" fill="#1A1A1A">98765 43210</text>
    <!-- Cursor -->
    <line x1="194" y1="18" x2="194" y2="38" stroke="#C45B28" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Voice hint -->
  <g transform="translate(24, 340)">
    <!-- Mic icon -->
    <rect x="2" y="1" width="8" height="12" rx="4" stroke="#6B6560" stroke-width="1" fill="none"/>
    <path d="M0 9c0 3 2.5 5 6 5s6-2 6-5" stroke="#6B6560" stroke-width="1" fill="none" stroke-linecap="round"/>
    <line x1="6" y1="14" x2="6" y2="17" stroke="#6B6560" stroke-width="1"/>
    <text x="22" y="13" font-size="11" fill="#9B9590" letter-spacing="0.3">Voice input available in your language</text>
  </g>

  <!-- Send button -->
  <rect x="24" y="392" width="342" height="52" rx="10" fill="#C45B28"/>
  <text x="195" y="423" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send Verification Code</text>

  <!-- Divider with OR -->
  <line x1="24" y1="490" x2="170" y2="490" stroke="#E8E4DF" stroke-width="1"/>
  <text x="195" y="494" font-size="12" fill="#9B9590" text-anchor="middle">OTP SENT</text>
  <line x1="220" y1="490" x2="366" y2="490" stroke="#E8E4DF" stroke-width="1"/>

  <!-- OTP Section -->
  <text x="24" y="540" font-size="24" font-weight="600" fill="#1A1A1A" letter-spacing="-0.3">Verification code</text>
  <text x="24" y="566" font-size="15" fill="#6B6560">Enter the 6-digit code sent to +91 98765 43210</text>

  <!-- OTP boxes -->
  <g transform="translate(24, 594)">
    <rect x="0" y="0" width="50" height="56" rx="10" fill="#FFFFFF" stroke="#C45B28" stroke-width="1.5"/>
    <text x="25" y="37" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">4</text>

    <rect x="58" y="0" width="50" height="56" rx="10" fill="#FFFFFF" stroke="#C45B28" stroke-width="1.5"/>
    <text x="83" y="37" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">7</text>

    <rect x="116" y="0" width="50" height="56" rx="10" fill="#FFFFFF" stroke="#C45B28" stroke-width="1.5"/>
    <text x="141" y="37" font-size="22" font-weight="600" fill="#1A1A1A" text-anchor="middle">2</text>

    <rect x="174" y="0" width="50" height="56" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <rect x="232" y="0" width="50" height="56" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <rect x="290" y="0" width="50" height="56" rx="10" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <!-- Cursor in 4th box -->
    <line x1="199" y1="16" x2="199" y2="42" stroke="#C45B28" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Verify button (disabled state) -->
  <rect x="24" y="680" width="342" height="52" rx="10" fill="#C45B28" opacity="0.5"/>
  <text x="195" y="711" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Verify</text>

  <!-- Resend -->
  <text x="195" y="758" font-size="14" font-weight="500" fill="#C45B28" text-anchor="middle">Resend code</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
</svg>

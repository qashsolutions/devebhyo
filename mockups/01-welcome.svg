<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <style>
      
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#FAFAF8"/>

  <!-- Status bar -->
  <text x="32" y="20" font-size="12" font-weight="600" fill="#1A1A1A">9:41</text>
  <rect x="310" y="12" width="22" height="10" rx="2" stroke="#1A1A1A" stroke-width="1" fill="none"/>
  <rect x="312" y="14" width="14" height="6" rx="1" fill="#1A1A1A"/>
  <rect x="333" y="15" width="1.5" height="4" rx="0.75" fill="#1A1A1A"/>

  <!-- Om Icon Container -->
  <circle cx="195" cy="160" r="48" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
  <!-- Om Symbol (simplified) -->
  <path d="M179 168c0 0-4-2-4-7s4-7 7-7 6 2 6 4-2 4-4 4-3-1-3-2" stroke="#C45B28" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M188 162c0 0 2-4 6-4s7 3 7 7-3 7-7 9" stroke="#C45B28" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M194 174c0 0-4 2-6 4s-2 4 0 6" stroke="#C45B28" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M201 162c0 0 3-1 3-5s-3-6-5-6" stroke="#C45B28" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="199" cy="147" r="2" fill="#C45B28"/>

  <!-- Title -->
  <text x="195" y="248" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle" letter-spacing="-0.5">Devebhyo</text>
  <text x="195" y="272" font-size="15" fill="#6B6560" text-anchor="middle" font-style="italic" letter-spacing="2">Namaḥ</text>

  <!-- Divider -->
  <line x1="175" y1="296" x2="215" y2="296" stroke="#C45B28" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="195" y="324" font-size="15" fill="#6B6560" text-anchor="middle">Connect with temples and priests</text>
  <text x="195" y="346" font-size="15" fill="#6B6560" text-anchor="middle">across South India</text>

  <!-- State badges -->
  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="85" height="28" rx="14" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="42" y="18" font-size="10" font-weight="500" fill="#6B6560" text-anchor="middle" letter-spacing="0.5">TELANGANA</text>

    <rect x="93" y="0" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="153" y="18" font-size="10" font-weight="500" fill="#6B6560" text-anchor="middle" letter-spacing="0.5">ANDHRA PRADESH</text>

    <rect x="221" y="0" width="88" height="28" rx="14" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="265" y="18" font-size="10" font-weight="500" fill="#6B6560" text-anchor="middle" letter-spacing="0.5">TAMIL NADU</text>
  </g>
  <g transform="translate(72, 426)">
    <rect x="0" y="0" width="95" height="28" rx="14" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="47" y="18" font-size="10" font-weight="500" fill="#6B6560" text-anchor="middle" letter-spacing="0.5">KARNATAKA</text>

    <rect x="103" y="0" width="105" height="28" rx="14" fill="#FFFFFF" stroke="#E8E4DF" stroke-width="1"/>
    <text x="155" y="18" font-size="10" font-weight="500" fill="#6B6560" text-anchor="middle" letter-spacing="0.5">MAHARASHTRA</text>
  </g>

  <!-- Features -->
  <g transform="translate(32, 510)">
    <!-- Temple icon small -->
    <path d="M8 2L11 6H5L8 2Z" stroke="#6B6560" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
    <line x1="5" y1="6" x2="5" y2="12" stroke="#6B6560" stroke-width="1"/>
    <line x1="8" y1="6" x2="8" y2="12" stroke="#6B6560" stroke-width="1"/>
    <line x1="11" y1="6" x2="11" y2="12" stroke="#6B6560" stroke-width="1"/>
    <line x1="3" y1="12" x2="13" y2="12" stroke="#6B6560" stroke-width="1.2"/>
    <text x="24" y="10" font-size="13" fill="#6B6560">20 sacred temples</text>
  </g>
  <g transform="translate(32, 538)">
    <circle cx="3" cy="6" r="2" fill="#C45B28" opacity="0.5"/>
    <text x="24" y="10" font-size="13" fill="#6B6560">Voice-first in your language</text>
  </g>
  <g transform="translate(32, 566)">
    <circle cx="3" cy="6" r="2" fill="#C45B28" opacity="0.5"/>
    <text x="24" y="10" font-size="13" fill="#6B6560">100% donations reach the temple</text>
  </g>

  <!-- Get Started Button -->
  <rect x="24" y="624" width="342" height="52" rx="10" fill="#C45B28"/>
  <text x="195" y="655" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Get Started</text>

  <!-- Footer -->
  <text x="195" y="700" font-size="11" fill="#9B9590" text-anchor="middle">By continuing, you agree to our Terms of Service</text>

  <!-- Home indicator -->
  <rect x="147" y="822" width="96" height="4" rx="2" fill="#1A1A1A" opacity="0.2"/>
